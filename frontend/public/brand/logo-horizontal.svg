<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 56" fill="none">
  <!-- EterPay Symbol: Interconnected arcs suggesting global payment flow -->
  <g transform="translate(4,4)">
    <!-- Outer arc ring -->
    <circle cx="24" cy="24" r="20" stroke="#0f4d40" stroke-width="2" fill="none" opacity="0.25"/>
    <!-- Inner arc ring -->
    <circle cx="24" cy="24" r="13" stroke="#0f4d40" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- Core dot -->
    <circle cx="24" cy="24" r="5" fill="#0f4d40"/>
    <!-- Connecting arc — payment flow lines -->
    <path d="M24 11 A13 13 0 0 1 37 24" stroke="#0f4d40" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M24 37 A13 13 0 0 1 11 24" stroke="#0f4d40" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Arrow tip on first arc -->
    <circle cx="37" cy="24" r="2.5" fill="#0f4d40"/>
  </g>
  <!-- Wordmark -->
  <text x="58" y="38" font-family="'ivypresto-headline','Playfair Display',Georgia,serif" font-size="28" font-weight="400" fill="#111111" letter-spacing="-0.5">EterPay</text>
</svg>
