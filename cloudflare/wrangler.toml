# EterPay — Wrangler Configuration
# Used for Cloudflare Pages deployment of the Next.js frontend

name = "eterpay-frontend"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "../frontend/.vercel/output/static"

# ─── Environment Variables (non-secret) ───────────────────────────────────────
[vars]
NEXT_PUBLIC_APP_NAME = "EterPay"
NEXT_PUBLIC_ENVIRONMENT = "production"

# ─── D1 Database Binding (optional — for Workers API) ─────────────────────────
# [[d1_databases]]
# binding = "DB"
# database_name = "eterpay-db"
# database_id = "REPLACE_WITH_D1_DATABASE_ID"

# ─── KV Namespace (optional — for session caching) ────────────────────────────
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "REPLACE_WITH_KV_ID"

# ─── R2 Storage (optional — for file uploads) ─────────────────────────────────
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "eterpay-uploads"

# ─── Production Environment ───────────────────────────────────────────────────
[env.production]
name = "eterpay-frontend-production"

[env.production.vars]
NEXT_PUBLIC_ENVIRONMENT = "production"

# ─── Staging Environment ──────────────────────────────────────────────────────
[env.staging]
name = "eterpay-frontend-staging"

[env.staging.vars]
NEXT_PUBLIC_ENVIRONMENT = "staging"
